services:
  db:
    image: mysql:8.4
    container_name: shulepulse-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: shulepulse
      MYSQL_USER: shulepulse
      MYSQL_PASSWORD: shulepulse
      MYSQL_ROOT_PASSWORD: rootpassword-change-me
    ports: ["3306:3306"]
    volumes: ["shulepulse_mysql:/var/lib/mysql"]
    command: ["--character-set-server=utf8mb4","--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-uroot","-prootpassword-change-me"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  shulepulse_mysql:
