{% extends 'base.html' %}{% block title %}Register School{% endblock %}{% block body %}<div class="flex min-h-screen items-center justify-center px-6 py-12"><div class="w-full max-w-xl rounded-2xl bg-white p-8 shadow-sm ring-1 ring-slate-200"><h1 class="text-2xl font-bold">Register your school</h1><p class="mt-2 text-sm text-slate-500">Create your school workspace.</p>{% if error %}<div class="mt-5 rounded-lg bg-red-50 p-3 text-sm text-red-700">{{ error }}</div>{% endif %}<form method="post" class="mt-6 space-y-5"><div><label class="label">School name</label><input class="input" name="school_name" required></div><div><label class="label">School handle</label><div class="flex"><input class="input rounded-r-none" name="slug" required pattern="[a-z0-9]+(?:-[a-z0-9]+)*"><span class="rounded-r-lg border border-l-0 border-slate-300 bg-slate-50 px-3 py-2.5 text-sm text-slate-500">.shulepulse.localhost</span></div></div><div class="grid gap-5 sm:grid-cols-2"><div><label class="label">First name</label><input class="input" name="first_name" required></div><div><label class="label">Last name</label><input class="input" name="last_name" required></div></div><div class="grid gap-5 sm:grid-cols-2"><div><label class="label">Email</label><input class="input" name="email" type="email"></div><div><label class="label">Phone</label><input class="input" name="phone"></div></div><div><label class="label">Password</label><input class="input" name="password" type="password" minlength="8" required></div><button class="w-full rounded-lg bg-emerald-700 px-4 py-3 font-semibold text-white">Create school workspace</button></form></div></div>{% endblock %}
