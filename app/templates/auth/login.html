{% extends 'base.html' %}{% block title %}{{ school.name }} — Login{% endblock %}{% block body %}<div class="flex min-h-screen items-center justify-center px-6"><div class="w-full max-w-md rounded-2xl bg-white p-8 shadow-sm ring-1 ring-slate-200"><p class="text-sm font-semibold text-emerald-700">ShulePulse</p><h1 class="mt-2 text-2xl font-bold">{{ school.name }}</h1>{% if error %}<div class="mt-5 rounded-lg bg-red-50 p-3 text-sm text-red-700">{{ error }}</div>{% endif %}<form method="post" class="mt-6 space-y-5"><div><label class="label">Email or phone</label><input class="input" name="identifier" required autocomplete="username"></div><div><label class="label">Password</label><input class="input" name="password" type="password" required autocomplete="current-password"></div><button class="w-full rounded-lg bg-emerald-700 px-4 py-3 font-semibold text-white">Sign in</button></form></div></div>{% endblock %}
